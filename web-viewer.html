<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claw Watch - OpenClaw 实时会话监控器</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* 优化后的配色 - 增加深度和对比 */
      --bg-primary: linear-gradient(135deg, #1a1a1a 0%, #1e1e1e 100%);
      --bg-secondary: linear-gradient(135deg, #232323 0%, #282828 100%);
      --bg-tertiary: #2f2f2f;
      --text-primary: #f0f0f0;
      --text-secondary: #c4c4c4;
      --text-dim: #8a8a8a;
      --border-color: #404040;
      --user-color: #4dabf7;
      --assistant-color: #51cf66;
      --tool-color: #ffd43b;
      --thinking-bg: rgba(30, 58, 95, 0.3);
      --thinking-border: #5b8fc7;
      --accent: #339af0;
      --accent-hover: #4dabf7;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* 噪点纹理背景 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
      pointer-events: none;
      opacity: 0.4;
      z-index: 1;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.65;
      position: relative;
    }

    .container {
      max-width: 1200px;
      min-width: 320px;
      margin: 0 auto;
      padding: 10px;
      position: relative;
      z-index: 2;
    }

    /* 优化 Header 样式 */
    header {
      background: var(--bg-secondary);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }

    .status {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #51cf66;
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px rgba(81, 207, 102, 0.6);
    }

    .status.disconnected {
      background: #ff6b6b;
      box-shadow: 0 0 8px rgba(255, 107, 107, 0.6);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .controls select,
    .controls input,
    .controls button {
      padding: 8px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
      min-height: 44px; /* 移动端触摸目标优化 */
    }

    .controls select:focus,
    .controls input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.1);
    }

    .controls button {
      cursor: pointer;
      font-weight: 500;
    }

    .controls button:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .controls button:active {
      transform: scale(0.98);
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 10px 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      min-height: 44px;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 12px rgba(51, 154, 240, 0.3);
    }

    .filter-btn:hover:not(.active) {
      background: rgba(47, 47, 47, 0.8);
      border-color: var(--border-color);
    }

    .messages {
      margin-top: 20px;
    }

    /* 消息卡片入场动画 */
    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
      min-width: 300px;
      animation: messageSlideIn 0.3s ease-out;
    }

    .message:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(51, 154, 240, 0.15);
      transform: translateY(-2px);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(64, 64, 64, 0.5);
    }

    .message-role {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .role-user { color: var(--user-color); }
    .role-assistant { color: var(--assistant-color); }
    .role-tool { color: var(--tool-color); }

    .message-meta-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .message-meta {
      color: var(--text-dim);
      font-size: 13px;
      white-space: normal;
      font-weight: 400;
    }

    .message-content {
      color: var(--text-primary);
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.7;
      font-size: 14px;
    }

    .message-content:empty {
      display: none;
    }

    .thinking-block {
      background: var(--thinking-bg);
      border: 1px solid var(--thinking-border);
      border-radius: 8px;
      margin: 8px 0 10px 0;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .thinking-header {
      padding: 10px 14px;
      background: rgba(91, 143, 199, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .thinking-header:hover {
      background: rgba(91, 143, 199, 0.25);
    }

    .thinking-content {
      padding: 10px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
      max-height: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .thinking-block.expanded .thinking-content {
      max-height: 600px;
      overflow-y: auto;
    }

    .thinking-block.expanded .toggle-icon {
      transform: rotate(90deg);
    }

    .toggle-icon {
      transition: transform 0.3s ease;
    }

    .tool-call {
      background: rgba(255, 212, 59, 0.1);
      border-left: 3px solid var(--tool-color);
      padding: 12px 14px;
      margin: 6px 0;
      border-radius: 6px;
    }

    .tool-name {
      color: var(--tool-color);
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .tool-args {
      color: var(--text-secondary);
      font-size: 13px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 6px;
    }

    .token-info {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(64, 64, 64, 0.5);
      color: var(--text-dim);
      font-size: 13px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-state-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-secondary);
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .auto-scroll-toggle {
      position: fixed;
      bottom: 32px;
      right: 32px;
      padding: 14px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      z-index: 100;
      font-weight: 600;
      font-size: 14px;
      min-height: 48px;
    }

    .auto-scroll-toggle:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .auto-scroll-toggle.disabled {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(26, 26, 26, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 5px;
      border: 2px solid rgba(26, 26, 26, 0.5);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-color);
    }

    .tool-args::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    /* 移动端优化 */
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 24px;
      }

      .controls {
        flex-direction: column;
      }

      .filter-group {
        width: 100%;
        justify-content: space-between;
      }

      .message {
        padding: 14px 16px;
      }

      .auto-scroll-toggle {
        bottom: 20px;
        right: 20px;
        padding: 12px 18px;
        font-size: 13px;
      }
    }

    /* 辅助功能：减少动画 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        🦞 Claw Watch
        <span class="status" id="status"></span>
      </h1>
      <div class="controls">
        <select id="agentSelector">
          <option value="">Loading agents...</option>
        </select>

        <button id="refreshBtn">🔄 Refresh</button>

        <div class="filter-group">
          <button class="filter-btn active" data-role="all">All</button>
          <button class="filter-btn" data-role="user">👤 User</button>
          <button class="filter-btn" data-role="assistant">🤖 Assistant</button>
        </div>

        <label>
          <input type="checkbox" id="showThinking" checked> Show Thinking
        </label>

        <label>
          <input type="checkbox" id="autoScroll" checked> Auto Scroll
        </label>

        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search messages...">
      </div>
    </header>

    <div id="messagesContainer" class="messages">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading session...</p>
      </div>
    </div>
  </div>

  <script>
    // 状态管理
    const state = {
      ws: null,
      messages: [],
      currentAgent: 'main',
      currentSessionPath: null,
      filterRole: 'all',
      showThinking: true,
      autoScroll: true,
      searchQuery: ''
    };

    // DOM 元素
    const elements = {
      status: document.getElementById('status'),
      agentSelector: document.getElementById('agentSelector'),
      refreshBtn: document.getElementById('refreshBtn'),
      showThinking: document.getElementById('showThinking'),
      autoScroll: document.getElementById('autoScroll'),
      searchBox: document.getElementById('searchBox'),
      messagesContainer: document.getElementById('messagesContainer'),
      filterBtns: document.querySelectorAll('.filter-btn')
    };

    // 开始监控文件
    function startWatching() {
      if (!state.currentSessionPath) {
        console.log('[Watch] No session path set');
        return;
      }

      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        console.log('[Watch] WebSocket not ready');
        return;
      }

      console.log('[Watch] Starting to watch:', state.currentSessionPath);
      state.ws.send(JSON.stringify({
        type: 'watch',
        path: state.currentSessionPath
      }));
    }

    // 连接 WebSocket
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      state.ws = new WebSocket(wsUrl);

      state.ws.onopen = () => {
        console.log('[WebSocket] Connected');
        elements.status.classList.remove('disconnected');

        // 连接成功后，如果有会话路径，立即开始监控
        if (state.currentSessionPath) {
          startWatching();
        }
      };

      state.ws.onclose = () => {
        console.log('[WebSocket] Disconnected');
        elements.status.classList.add('disconnected');

        // 3秒后重连
        setTimeout(connectWebSocket, 3000);
      };

      state.ws.onerror = (error) => {
        console.error('[WebSocket] Error:', error);
      };

      state.ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        console.log('[WebSocket] Received:', message.type);

        if (message.type === 'update') {
          console.log('[WebSocket] New message data:', message.data);
          handleNewMessage(message.data);
        } else if (message.type === 'watching') {
          console.log('[WebSocket] Now watching:', message.path);
        }
      };
    }

    // 加载 agent 列表
    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        const { agents } = await res.json();

        elements.agentSelector.innerHTML = agents.map(name =>
          `<option value="${name}" ${name === state.currentAgent ? 'selected' : ''}>${name}</option>`
        ).join('');
      } catch (error) {
        console.error('Failed to load agents:', error);
      }
    }

    // 加载会话
    async function loadSession(agentName = 'main') {
      state.currentAgent = agentName;

      try {
        // 获取最新会话文件
        const sessionRes = await fetch(`/api/latest-session?agent=${agentName}`);
        const session = await sessionRes.json();

        if (session.error) {
          showEmptyState('No session found');
          return;
        }

        state.currentSessionPath = session.path;

        // 读取会话内容
        const dataRes = await fetch(`/api/session?path=${encodeURIComponent(session.path)}`);
        const { data } = await dataRes.json();

        state.messages = data;
        renderMessages();

        // 开始监控文件变化
        startWatching();
        
        // 启动轮询（备用方案，因为容器内 fs.watch 可能不可靠）
        startPolling();
      } catch (error) {
        console.error('Failed to load session:', error);
        showEmptyState('Failed to load session');
      }
    }

    // 轮询功能
    let pollInterval = null;
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        if (!state.currentSessionPath) return;
        
        try {
          const dataRes = await fetch(`/api/session?path=${encodeURIComponent(state.currentSessionPath)}`);
          const { data } = await dataRes.json();
          
          // 检查是否有新消息
          if (data.length > state.messages.length) {
            console.log('[Poll] Found new messages:', data.length - state.messages.length);
            state.messages = data;
            renderMessages();
          }
        } catch (error) {
          console.error('[Poll] Error:', error);
        }
      }, 3000); // 每3秒轮询一次
    }

    // 处理新消息
    function handleNewMessage(message) {
      // 检查是否已存在（避免重复）
      const exists = state.messages.some(msg =>
        msg.timestamp === message.timestamp &&
        msg.type === message.type
      );

      if (!exists) {
        state.messages.push(message);
        renderMessages();

        // 实时更新时闪烁提示
        if (message.type === 'message') {
          const firstMessage = document.querySelector('.message');
          if (firstMessage) {
            firstMessage.style.animation = 'messageSlideIn 0.3s ease-in';
          }
        }
      }
    }

    // 渲染消息列表
    function renderMessages() {
      const filtered = state.messages.filter(msg => {
        if (msg.type !== 'message') return false;

        const role = msg.message?.role || 'unknown';
        const content = msg.message?.content || [];

        // 过滤空消息
        if (Array.isArray(content) && content.length === 0) {
          return false;
        }

        // 检查是否所有内容项都为空
        if (Array.isArray(content)) {
          const hasContent = content.some(item => {
            if (!item || typeof item !== 'object') return false;
            if (item.type === 'text' && item.text && item.text.trim()) return true;
            if (item.type === 'thinking' && state.showThinking && (item.thinking || item.text)) return true;
            if (item.type === 'toolCall') return true;
            if (item.type === 'toolResult') return true;
            return false;
          });
          if (!hasContent) return false;
        }

        // 角色过滤
        if (state.filterRole !== 'all' && role !== state.filterRole) {
          return false;
        }

        // 搜索过滤
        if (state.searchQuery) {
          const contentStr = JSON.stringify(content).toLowerCase();
          if (!contentStr.includes(state.searchQuery.toLowerCase())) {
            return false;
          }
        }

        return true;
      });

      if (filtered.length === 0) {
        showEmptyState('No messages to display');
        return;
      }

      // 按时间倒序排序（最新的在上面）
      const sorted = filtered.sort((a, b) => {
        const timeA = new Date(a.timestamp).getTime();
        const timeB = new Date(b.timestamp).getTime();
        return timeB - timeA; // 倒序
      });

      elements.messagesContainer.innerHTML = sorted.map(msg => renderMessage(msg)).join('');

      // 自动滚动到顶部（因为最新消息在顶部）
      if (state.autoScroll) {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }

      // 添加思考块折叠事件
      document.querySelectorAll('.thinking-header').forEach(header => {
        header.addEventListener('click', () => {
          header.parentElement.classList.toggle('expanded');
        });
      });
    }

    // 渲染单个消息
    function renderMessage(msg) {
      const message = msg.message || {};
      const role = message.role || 'unknown';
      const content = message.content || [];
      const timestamp = new Date(msg.timestamp).toLocaleString('zh-CN');

      const roleEmoji = role === 'user' ? '👤' : role === 'assistant' ? '🤖' : '⚙️';
      const roleClass = `role-${role}`;

      const contentHtml = renderContent(content);

      // 构建元信息组
      let metaItems = [`<div class="message-meta">${timestamp}</div>`];
      if (message.model) {
        metaItems.push(`<div class="message-meta">Model: ${message.model}</div>`);
      }
      const metaHtml = `<div class="message-meta-group">${metaItems.join('')}</div>`;

      let tokenInfo = '';
      if (message.usage && message.usage.totalTokens) {
        tokenInfo = `
          <div class="token-info">
            📊 Tokens: ${message.usage.totalTokens} (in: ${message.usage.input}, out: ${message.usage.output})
          </div>
        `;
      }

      return `
        <div class="message">
          <div class="message-header">
            <div class="message-role ${roleClass}">
              ${roleEmoji} ${role.charAt(0).toUpperCase() + role.slice(1)}
            </div>
            ${metaHtml}
          </div>
          <div class="message-content">
            ${contentHtml}
          </div>
          ${tokenInfo}
        </div>
      `;
    }

    // 渲染消息内容
    function renderContent(content) {
      if (!Array.isArray(content)) {
        return escapeHtml(String(content));
      }

      return content.map(item => {
        if (typeof item !== 'object') return '';

        if (item.type === 'text') {
          return escapeHtml(item.text || '');
        }

        if (item.type === 'thinking' && state.showThinking) {
          const thinkingText = escapeHtml(item.thinking || item.text || '');
          return `
            <div class="thinking-block">
              <div class="thinking-header">
                <span class="toggle-icon">▶</span>
                <span>💭 Thinking</span>
              </div>
              <div class="thinking-content">${thinkingText}</div>
            </div>
          `;
        }

        if (item.type === 'toolCall') {
          const toolName = item.name || 'unknown';
          let args = '';
          
          // 只显示非空参数
          if (item.arguments && Object.keys(item.arguments).length > 0) {
            args = JSON.stringify(item.arguments, null, 2);
          }
          
          return `
            <div class="tool-call">
              <div class="tool-name">🔧 Tool: ${toolName}</div>
              ${args ? `<pre class="tool-args">${escapeHtml(args)}</pre>` : '<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">(no parameters)</div>'}
            </div>
          `;
        }

        if (item.type === 'toolResult') {
          return '<div class="tool-call"><div class="tool-name">✓ Tool Result</div></div>';
        }

        return '';
      }).join('');
    }

    // 显示空状态
    function showEmptyState(message) {
      elements.messagesContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>${message}</p>
        </div>
      `;
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 事件监听
    elements.agentSelector.addEventListener('change', (e) => {
      loadSession(e.target.value);
    });

    elements.refreshBtn.addEventListener('click', () => {
      loadSession(state.currentAgent);
    });

    elements.showThinking.addEventListener('change', (e) => {
      state.showThinking = e.target.checked;
      renderMessages();
    });

    elements.autoScroll.addEventListener('change', (e) => {
      state.autoScroll = e.target.checked;
    });

    elements.searchBox.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      renderMessages();
    });

    elements.filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        elements.filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.filterRole = btn.dataset.role;
        renderMessages();
      });
    });

    // 初始化
    async function init() {
      // 先连接 WebSocket（异步，不等待）
      connectWebSocket();

      // 加载 agents 和会话
      await loadAgents();
      await loadSession(state.currentAgent);
    }

    init();
  </script>
</body>
</html>
