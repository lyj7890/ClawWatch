apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clawwatch-hub
  namespace: openclaw
  labels:
    app: clawwatch-hub
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: clawatch.intra.mlamp.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clawwatch-hub
                port:
                  name: http
  tls:
    - hosts:
        - clawatch.intra.mlamp.cn
      secretName: mlamp-cert
