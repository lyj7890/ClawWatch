apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawwatch-hub
  namespace: openclaw
  labels:
    app: clawwatch-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawwatch-hub
  template:
    metadata:
      labels:
        app: clawwatch-hub
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: clawwatch-hub
          image: hub.intra.mlamp.cn/k8s/clawwatch-hub:v1.0.0
          ports:
            - containerPort: 4848
              name: http
          env:
            - name: PORT
              value: "4848"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4848
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4848
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: clawwatch-hub
  namespace: openclaw
  labels:
    app: clawwatch-hub
spec:
  selector:
    app: clawwatch-hub
  ports:
    - name: http
      port: 4848
      targetPort: 4848
  type: ClusterIP
