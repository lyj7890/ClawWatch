version: '3.8'

services:
  claw-watch:
    build:
      context: .
      dockerfile: Dockerfile
    image: claw-watch:latest
    container_name: claw-watch
    ports:
      - "3939:3939"
    volumes:
      # 挂载上级 .openclaw 目录为只读
      - ${HOME}/.openclaw:/root/.openclaw:ro
    environment:
      - PORT=3939
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3939/api/agents', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
